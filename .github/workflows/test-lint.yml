on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
      - '**/*'

name: Test Action

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v3
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies
        run: pdm install -v && pdm info

      - name: Lint
        run: make lint

  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]
    name: CI
    needs: [lint]  # optional: run tests only if lint passes
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v3
        with:
          python-version: ${{ matrix.python-version }}
          cache: true

      - name: Install dependencies
        run: pdm install -v && pdm info

      - name: Test
        run: make test
